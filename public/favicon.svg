<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Fundo Quadrado Arredondado Escuro -->
  <rect width="128" height="128" rx="36" fill="url(#bgGrad)" />

  <!-- Círculo Externo Esmeralda -->
  <circle cx="64" cy="64" r="38" fill="none" stroke="#10b981" stroke-width="7" stroke-linecap="round" />

  <!-- Agulha da Bússola Estilizada -->
  <g transform="rotate(-45 64 64)" filter="url(#glow)">
    <!-- Ponteiro Norte (Verde Esmeralda Claro) -->
    <polygon points="64,34 73,64 64,60 55,64" fill="#34d399" />
    
    <!-- Ponteiro Sul (Verde Esmeralda Escuro) -->
    <polygon points="64,94 73,64 64,68 55,64" fill="#059669" />
    
    <!-- Ponto Central -->
    <circle cx="64" cy="64" r="4.5" fill="#0f172a" stroke="#10b981" stroke-width="2.5" />
  </g>
</svg>
